# IMPORTANT: Do not commit actual credentials to git!
# This is a template file. Replace placeholders with actual values when deploying.

# Option 1: Apply this template after replacing <YOUR_GITHUB_USERNAME> and <YOUR_GITHUB_TOKEN>
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: default
type: Opaque
stringData:
  username: "<YOUR_GITHUB_USERNAME>"
  token: "<YOUR_GITHUB_TOKEN>"
---
# Option 2: Create the secret directly with kubectl (RECOMMENDED):
# kubectl create secret generic git-credentials \
#   --from-literal=username=your-github-username \
#   --from-literal=token=ghp_your_actual_token \
#   -n default
