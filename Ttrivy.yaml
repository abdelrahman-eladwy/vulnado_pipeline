apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
spec:
  description: Scan a container image using Trivy and fail if severe vulnerabilities exist.
  params:
    - name: image-name
      type: string
    - name: image-tag
      type: string
      default: "latest"
    - name: dockerhub-username
      type: string
  workspaces:
    - name: source
      description: Workspace to store vulnerability reports and cache

  steps:
    - name: trivy-image-scan
      image: aquasec/trivy:latest
      env:
        - name: HOME
          value: "$(workspaces.source.path)"
        - name: TRIVY_CACHE_DIR
          value: "$(workspaces.source.path)/.trivy-cache"
      script: |
        #!/bin/sh
        set -e

        mkdir -p "$TRIVY_CACHE_DIR"

        IMAGE="docker.io/$(params.dockerhub-username)/$(params.image-name):$(params.image-tag)"
        REPORT="$(workspaces.source.path)/trivy-report.json"

        echo "[INFO] Running Trivy scan on $IMAGE"
        trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --format table \
          --ignore-unfixed \
          --cache-dir "$TRIVY_CACHE_DIR" \
          --output "$REPORT" \
          "$IMAGE" || SCAN_STATUS=$?

        if [ "$SCAN_STATUS" = "1" ]; then
          echo "[ERROR] HIGH/CRITICAL vulnerabilities found!"
          cat "$REPORT"
          exit 0
        fi

        echo "[INFO] No HIGH/CRITICAL vulnerabilities found."
