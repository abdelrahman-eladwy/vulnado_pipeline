apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: grype-scan
spec:
  description: Scan a container image using Anchore Grype.
  params:
    - name: image-name
      type: string
    - name: image-tag
      type: string
      default: "latest"
    - name: dockerhub-username
      type: string
  workspaces:
    - name: source

  steps:
    - name: grype-image-scan
      image: curlimages/curl:latest
      workingDir: "$(workspaces.source.path)"
      env:
        - name: GRYPE_DB_CACHE_DIR
          value: "$(workspaces.source.path)/.grype"
      script: |
        #!/bin/sh
        set -e
        
        # Install Grype to workspace (non-root writable location)
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $(workspaces.source.path)
        
        IMAGE="docker.io/$(params.dockerhub-username)/$(params.image-name):$(params.image-tag)"
        REPORT_JSON="$(workspaces.source.path)/grype-report.json"
        REPORT_TABLE="$(workspaces.source.path)/grype-report.txt"
        
        echo "[INFO] Running Grype scan on $IMAGE"
        
        # Run scan and save both JSON and table formats
        $(workspaces.source.path)/grype "$IMAGE" -o json > "$REPORT_JSON" || SCAN_STATUS=$?
        $(workspaces.source.path)/grype "$IMAGE" -o table > "$REPORT_TABLE" || true
        
        echo ""
        echo "=========================================="
        echo "  Grype Vulnerability Scan Results"
        echo "=========================================="
        echo ""
        cat "$REPORT_TABLE"
        echo ""
        
        if [ "$SCAN_STATUS" != 0 ]; then
          echo "[WARNING] Vulnerabilities found by Grype (see table above)"
          exit 0
        fi
        
        echo "[INFO] No vulnerabilities found by Grype"
