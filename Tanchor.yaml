apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: grype-scan
spec:
  description: Scan a container image using Anchore Grype.
  params:
    - name: image-name
      type: string
    - name: image-tag
      type: string
      default: "latest"
    - name: dockerhub-username
      type: string
  workspaces:
    - name: source

  steps:
    - name: prepare-workspace
      image: busybox
      workingDir: "$(workspaces.source.path)"
      script: |
        #!/bin/sh
        mkdir -p $(workspaces.source.path)/tmp
        mkdir -p $(workspaces.source.path)/.grype
        mkdir -p $(workspaces.source.path)/.cache
        echo "Workspace prepared"
    
    - name: grype-image-scan
      image: anchore/grype:v0.102.0
      workingDir: "$(workspaces.source.path)"
      env:
        - name: GRYPE_DB_CACHE_DIR
          value: "$(workspaces.source.path)/.grype"
        - name: XDG_CACHE_HOME
          value: "$(workspaces.source.path)/.cache"
        - name: TMPDIR
          value: "$(workspaces.source.path)/tmp"
      args:
        - "-o"
        - "table"
        - "docker.io/$(params.dockerhub-username)/$(params.image-name):$(params.image-tag)"
